name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  branch-flow:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate pull request branch flow
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          if [[ "$BASE_BRANCH" == "dev" && "$HEAD_BRANCH" == feat/* ]]; then
            echo "Valid feature flow: $HEAD_BRANCH -> $BASE_BRANCH"
            exit 0
          fi

          if [[ "$BASE_BRANCH" == "main" && "$HEAD_BRANCH" == "dev" && "$PR_AUTHOR" == "WaylandYang" ]]; then
            echo "Valid owner release flow: $HEAD_BRANCH -> $BASE_BRANCH"
            exit 0
          fi

          echo "Invalid pull request branch flow: $HEAD_BRANCH -> $BASE_BRANCH"
          echo "Allowed flows are feat/** -> dev and owner-authored dev -> main."
          exit 1

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level=high
      - run: pnpm lint
      - run: pnpm build

  dotnet-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TESTCONTAINERS_RYUK_DISABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: "**/*.csproj"
      - name: Restore + build
        run: |
          dotnet restore src/ISEStudio.sln
          dotnet build src/ISEStudio.sln --no-restore -c Release
      - name: Unit tests (ISEStudio.Tests)
        run: dotnet test src/ISEStudio.Tests/ISEStudio.Tests.csproj --no-build -c Release --logger "console;verbosity=normal"
      - name: API contract tests
        run: dotnet test src/ISEStudio.ApiContract.Tests/ISEStudio.ApiContract.Tests.csproj --no-build -c Release --logger "console;verbosity=normal"
      - name: Integration tests (Postgres service)
        run: dotnet test src/ISEStudio.IntegrationTests/ISEStudio.IntegrationTests.csproj --no-build -c Release --filter "Category!=Container" --logger "console;verbosity=normal"
