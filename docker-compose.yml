# ISEStudio self-hosted stack (.NET 10 backend + PostgreSQL + MinIO + Frontend).
#   cp src/.env.example src/.env
#   cp .env.example .env && edit .env to set POSTGRES_PASSWORD + MINIO_ACCESS_KEY + MINIO_SECRET_KEY
#   docker compose up -d --build
#   open http://localhost:8080
#
# Healthcheck paths and service ports are kept in sync with the .NET image:
#   - backend listens on 8080 (ASP.NET Core env ASPNETCORE_URLS=http://+:8080)
#   - /api/health is the liveness probe (NOT /health — the migration spec
#     repeatedly references /api/health so a Docker healthcheck pointed at
#     /health would silently fail in compose and block the frontend).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: isestudio
      POSTGRES_USER: isestudio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
    volumes:
      - isestudio-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U isestudio -d isestudio"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Bind on all interfaces by default so the DB is reachable from the host
    # (psql / pgAdmin / local dev tools) and from other LAN devices. For a
    # tighter security posture set POSTGRES_BIND_ADDRESS=127.0.0.1 so only
    # the host itself can connect.
    ports:
      - "${POSTGRES_BIND_ADDRESS:-0.0.0.0}:${POSTGRES_PORT:-5432}:5432"
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY in the root .env file}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in the root .env file}
    command: server /data --console-address ":9001"
    volumes:
      - isestudio-minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    expose:
      - "9000"   # S3 API
      - "9001"   # Console

  # ---- migrate (init container) ----
  # Runs the EF Core migrations baked into the backend image and exits.
  # Uses the SAME image as `backend` (built below) with a different entry
  # command so the migration logic and the DbContext stay co-located —
  # no `dotnet-ef` global tool is needed in the runtime image. The
  # `--migrate` subcommand is handled at the top of `Program.cs` and
  # calls `Database.MigrateAsync()`, which is idempotent (consults
  # `__EFMigrationsHistory`) and safe to re-run.
  #
  # `restart: "no"` so a transient Postgres hiccup doesn't loop forever;
  # if migrations fail the operator must inspect logs and re-run. The
  # backend service below waits on `service_completed_successfully`,
  # so the API never starts against an un-migrated schema.
  isestudio-migrate:
    image: isestudio-backend
    # Override the Dockerfile's ENTRYPOINT (not just CMD) — if we set
    # `command:` Docker would APPEND the values to the existing ENTRYPOINT,
    # producing `dotnet ISEStudio.dll dotnet ISEStudio.dll --migrate`, which
    # means the application's `args[0]` is "dotnet" instead of "--migrate".
    # Setting `entrypoint:` replaces the Dockerfile's ENTRYPOINT outright
    # so the app sees `args = ["--migrate"]` and the `--migrate` branch in
    # Program.cs fires correctly.
    entrypoint: ["dotnet", "ISEStudio.dll", "--migrate"]
    env_file: ./src/.env
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      # Same provider/connection string as `backend` — EF Core binds
      # `ISEStudio:Persistence:ConnectionString` via the double-underscore
      # delimiter used by ASP.NET Core's EnvironmentVariables provider.
      ISEStudio__Persistence__Provider: npgsql
      ISEStudio__Persistence__ConnectionString: Host=postgres;Port=5432;Database=${POSTGRES_DB:-isestudio};Username=${POSTGRES_USER:-isestudio};Password=${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # ---- seed-admin (opt-in via --profile bootstrap) ----
  # Insert the first administrator user into the database and exit. Same
  # backend image, different entrypoint. NOT started by default — operator
  # opts in once after migrations have run:
  #
  #   docker compose --profile bootstrap run --rm seed-admin
  #
  # Credentials are passed via env (not CLI argv) so the operator can
  # stash them in a secrets manager / .env file without leaking into
  # `docker compose ps` or shell history. The `--seed-admin` branch in
  # Program.cs is idempotent — re-running after a successful seed is a
  # no-op exit 0.
  isestudio-seed-admin:
    image: isestudio-backend
    profiles: ["bootstrap"]
    entrypoint: ["dotnet", "ISEStudio.dll", "--seed-admin"]
    env_file: ./src/.env
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ISEStudio__Persistence__Provider: npgsql
      ISEStudio__Persistence__ConnectionString: Host=postgres;Port=5432;Database=${POSTGRES_DB:-isestudio};Username=${POSTGRES_USER:-isestudio};Password=${POSTGRES_PASSWORD}
      # SEED_ADMIN_USERNAME / SEED_ADMIN_PASSWORD are intentionally
      # interpolated with empty defaults (NOT `${VAR:?...}`) so compose
      # file parsing doesn't fail when the operator hasn't set them —
      # profiles don't bypass file-level env interpolation. Program.cs's
      # --seed-admin branch validates the values and throws with a clear
      # message if either is missing.
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_ADMIN_DISPLAY_NAME: ${SEED_ADMIN_DISPLAY_NAME:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  isestudio:
    # The .NET Dockerfile lives at `src/Dockerfile` (co-located with the
    # .NET solution it builds). Build context is `./src` so `COPY . ./`
    # lands the whole `src/` tree in `/src/` and `dotnet publish
    # ISEStudio/ISEStudio.csproj` resolves cleanly. `src/.dockerignore`
    # keeps the build context lean (excludes bin/obj, IDE files,
    # test-only projects).
    build:
      context: ./src
      dockerfile: Dockerfile
    image: isestudio-backend   # fixed name so the `migrate` / `seed-admin` init containers can reuse this image
    env_file: ./src/.env
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:8080
      # EF Core binds ISEStudio:Persistence:ConnectionString via the
      # double-underscore delimiter used by ASP.NET Core's
      # EnvironmentVariablesConfigurationProvider.
      ISEStudio__Persistence__Provider: npgsql
      ISEStudio__Persistence__ConnectionString: Host=postgres;Port=5432;Database=${POSTGRES_DB:-isestudio};Username=${POSTGRES_USER:-isestudio};Password=${POSTGRES_PASSWORD}
      ISEStudio__Storage__Endpoint: minio:9000
      ISEStudio__Storage__AccessKey: ${MINIO_ACCESS_KEY}
      ISEStudio__Storage__SecretKey: ${MINIO_SECRET_KEY}
      ISEStudio__Storage__Bucket: ${MINIO_BUCKET:-isestudio-blobs}
      ISEStudio__Storage__UseSsl: "false"
      ISEStudio__SystemLanguage: ${SYSTEM_LANGUAGE:-en}
      ISEStudio__PublicHost: ${MCP_PUBLIC_HOST:-localhost}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      isestudio-migrate:
        condition: service_completed_successfully
    volumes:
      - isestudio-data:/app/data
    healthcheck:
      # /api/health is the only contract path; any other path returns
      # 404 from MapControllers and would fail the healthcheck. The
      # backend binds 8080 inside the container (ASPNETCORE_URLS).
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    expose:
      - "8080"

  frontend:
    build: ./frontend
    depends_on:
      isestudio:
        condition: service_healthy
    ports:
      - "${ISESTUDIO_BIND_ADDRESS:-0.0.0.0}:${ISESTUDIO_PORT:-8080}:80"
    restart: unless-stopped

volumes:
  isestudio-data:
  isestudio-postgres:
  isestudio-minio:
