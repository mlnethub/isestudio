# OnToPilot differential shadow topology.
#
# PURPOSE
# -------
# Run the legacy Python backend and the new .NET backend in parallel against
# the SAME PostgreSQL + MinIO so a request replayed against both surfaces
# yields an identical response. Used exclusively by the migration's
# differential contract harness (see
# `src/OnToPilot.ApiContract.Tests/DifferentialContractTests.cs`).
#
# CRITICAL INVARIANT
# ------------------
# Python and .NET MUST NOT open the same RocksDB directory concurrently —
# Oxigraph holds an exclusive lock and a parallel open will either fail or
# silently corrupt the store. The .NET service therefore mounts a
# DIFFERENT directory (`ontopilot-shadow-ontopilot-net`) and the Python
# service mounts its original (`ontopilot-shadow-ontopilot-py`). A
# pre-flight `mc mirror` (or N-Quads copy) is responsible for seeding the
# .NET directory from the Python one; this compose file does NOT do that
# automatically because differential replays run against the same logical
# snapshot, not against two stores that drift independently.
#
# USAGE
# -----
#   # 1. Stop the production compose stack so PostgreSQL / MinIO ports are free.
#   docker compose -f docker-compose.yml down
#   # 2. Bring up the shadow stack on alternate ports.
#   docker compose -f migration/compose/docker-compose.shadow.yml up -d --build
#   # 3. Replay a request against both backends.
#   curl http://localhost:18080/api/health
#   curl http://localhost:18081/api/health
#   # 4. Tear down.
#   docker compose -f migration/compose/docker-compose.shadow.yml down
#
# The shadow stack lives behind different host ports (18080 / 18081 /
# 15432 / 19000 / 19001) so it never collides with the production stack
# the user might still be running.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ontopilot
      POSTGRES_USER: ontopilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
    volumes:
      - ontopilot-shadow-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ontopilot -d ontopilot"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    ports:
      - "15432:5432"

  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY in the root .env file}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in the root .env file}
    command: server /data --console-address ":9001"
    volumes:
      - ontopilot-shadow-minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    ports:
      - "19000:9000"
      - "19001:9001"

  backend-py:
    # Legacy Python backend — present ONLY to drive differential replays.
    # The production stack no longer references this image; it lives here
    # because the differential runner (DifferentialContractTests) needs
    # both surfaces running at the same time to assert equivalent JSON.
    image: ontopilot-backend-python:shadow
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ontopilot
      DATABASE_USER: ontopilot
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      SYSTEM_LANGUAGE: ${SYSTEM_LANGUAGE:-en}
      MCP_PUBLIC_URL: http://localhost:18081/mcp
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ontopilot-blobs
      MINIO_USE_SSL: "false"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      # Python writes to its OWN RocksDB directory; the .NET service
      # mounts a separate directory below. They MUST NOT point at the
      # same host path or the same named volume.
      - ontopilot-shadow-ontopilot-py:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    expose:
      - "8000"
    ports:
      - "18080:8000"

  backend-net:
    # New .NET backend — same compose family, different data root.
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    env_file: ../../backend/.env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      OnToPilot__Persistence__Provider: npgsql
      OnToPilot__Persistence__ConnectionString: Host=postgres;Port=5432;Database=ontopilot;Username=ontopilot;Password=${POSTGRES_PASSWORD}
      OnToPilot__Storage__Endpoint: minio:9000
      OnToPilot__Storage__AccessKey: ${MINIO_ACCESS_KEY}
      OnToPilot__Storage__SecretKey: ${MINIO_SECRET_KEY}
      OnToPilot__Storage__Bucket: ontopilot-blobs
      OnToPilot__Storage__UseSsl: "false"
      OnToPilot__PublicHost: localhost
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      # Distinct named volume — see the CRITICAL INVARIANT block above.
      - ontopilot-shadow-ontopilot-net:/app/data
    healthcheck:
      # Same contract path as the production stack: /api/health.
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    expose:
      - "8080"
    ports:
      - "18081:8080"

volumes:
  ontopilot-shadow-postgres:
  ontopilot-shadow-minio:
  # Two separate RocksDB volumes — Python writes its store to
  # ontopilot-shadow-ontopilot-py; .NET writes its store to
  # ontopilot-shadow-ontopilot-net. They MUST stay disjoint.
  ontopilot-shadow-ontopilot-py:
  ontopilot-shadow-ontopilot-net:
